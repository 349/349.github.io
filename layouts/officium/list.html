{{ define "main" }}
<div class="wrap wrap--wide">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lede }}<p class="lede">{{ . }}</p>{{ end -}}
  </header>

  {{- with .Content }}<div class="prose section-intro">{{ . }}</div>{{ end }}

  <div id="office-app" class="office">
    <div id="office-date" class="office-date"></div>
    <nav id="office-hours" class="office-hours" aria-label="Hours of the Office"></nav>
    <section id="office-view" class="office-view" aria-live="polite"><p class="muted">Loading the Office…</p></section>
    <noscript><p class="muted">The dynamic office requires JavaScript. The psalms themselves are all available under <a href="{{ "/psalmi/" | relURL }}">the Psalter</a>.</p></noscript>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script>
  // Office data is fetched at runtime from /data/*.json (see static/data/) rather
  // than inlined — large inline JSON was unreliable across the build/minify path.
  window.DATA_BASE = {{ "/data/" | relURL | jsonify }};
  window.PSALTER_BASE = {{ "/psalmi/" | relURL | jsonify }};
</script>
<script src="https://cdn.jsdelivr.net/npm/exsurge@0.0.0/dist/exsurge.min.js" defer></script>
<script>{{ (resources.Get "js/office.js").Content | safeJS }}</script>
{{ end }}
